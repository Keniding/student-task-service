spring:
  application:
    name: student-task-service

  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: dbuser
    password: dbsecret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  main:
    allow-bean-definition-overriding: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  level:
    com.keniding: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
